version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: campus_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?définir DB_ROOT_PASSWORD}
      MYSQL_DATABASE: campus_it
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
